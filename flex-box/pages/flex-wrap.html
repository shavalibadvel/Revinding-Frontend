<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FLEX WRAP</title>
        <style>
           .image-gallery {
                display: flex;
                flex-wrap: wrap;
                gap: 15px; /* Spacing between the images */
                justify-content: center; /* Centers the row items nicely */
                padding: 20px;
                }

            .image-gallery img {
                flex: 1 1 200px; /* Allows images to grow/shrink with a minimum base width of 200px */
                max-width: 280px; /* Caps the maximum width on larger screens */
                height: 180px; /* Sets a uniform height for a clean grid look */
                object-fit: cover; /* Crops images neatly without distorting their aspect ratio */
                border-radius: 8px; /* Optional: adds rounded corners */
                }
        </style>
    </head>
    <body>
        <div class="image-gallery">
