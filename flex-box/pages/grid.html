<!DOCTYPE html>
<html>
    <head>
        <title>Grid Layout</title>
        <style>
            h1{
                display:flex;
                justify-content:center;
                color: blueviolet;
            }
            .grid-container {
                display: grid;
                grid-template-rows: repeat(4, 10rem);
                grid-template-columns: repeat(3, 1fr);
                /* gap:10px; */
            }
            .grid-item {
                padding: 20px;
                /* border: 1px solid #ccc; */
            }
            #item1 {
                grid-row-start: 1;
                grid-row-end: 0;
                grid-column-start: 1;
                grid-column-end:3;
                background-color: lightblue;
            }
            #item2 {
                grid-row-start: 1;
                grid-row-end: 4;
                grid-column-start: 3;
                grid-column-end:0;
                background-color: lightgreen;
            }
            #item3 {
                grid-row-start: 2;
                grid-row-end: 5;
                grid-column-start: 1;
                grid-column-end:0;
                background-color: lightcoral;
            }
            #item4 {
                grid-row-start: 2;
                grid-row-end: 0;
                grid-column-start: 2;
                grid-column-end:0;  
                background-color: lightgoldenrodyellow;
            }
            #item5 {
                 grid-row-start: 3;
                grid-row-end: 0;
                grid-column-start: 2;
                grid-column-end:0;  
                background-color: lightpink;
            }
            #item6 {  
                grid-row-start: 4;
                grid-row-end: 0;
                grid-column-start: 2;
                grid-column-end:4;  
                background-color: lightgray;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>CSS Grid Layout</h1>
        </header>
        <div class="grid-container">
            <div class="grid-item" id="item1">
                <p>1</p>
            </div>
            <div class="grid-item" id="item2" >
                <p>2</p>
            </div>
            <div class="grid-item" id="item3">
                <p>3</p>
            </div>
            <div class="grid-item" id="item4">
                <p>4</p>
            </div>
            <div class="grid-item" id="item5">
                <p>5</p>
            </div>
            <div class="grid-item" id="item6">
                <p>6</p>
            </div>
        </div>
        
    </body>
</html>
