<!DOCTYPE html>
<html>
    <head>
        <title>
            MEDIA QUERIES
        </title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                background-color: red;
            }
            @media (max-width: 600px) {
                body {
                    background-color: green;
                }
            }
            @media(max-width: 300px){
                body{
                    background-color: blue;
                }
            }

        </style>
    </head>
    <body>
        <div>
            <h1>Media Queries</h1>
            <p>Media queries are a powerful tool in CSS that allow you to apply styles based on the viewport size or device characteristics. This enables responsive design, ensuring your website looks great on all devices.</p>
    
        </div>
            </body>
</html>
