<!DOCTYPE html>
<html>
    <head>
        <title>Positioning</title>
        <style>
            .body{
                margin:0;
                border: 0;
                padding: 0;
            }
           header h1{
            display:flex;
            justify-content:center;
            color:blueviolet;
            letter-spacing: -1px;
           }
           #parent{
            margin: auto;
            width: 256px;
            height: 256px;
            background-color: black;
            position: relative;
            /* position: static; */
           }
           #child-1{
            width:2rem;
            height:2rem;
            background-color: rgb(236, 87, 33);
            /* position: static; */
            position: absolute;
            right:0;
           }
           #child-2{
               width:2rem;
               height:2rem;
               background-color: rgb(52, 248, 104);
               /* position: static; */
               position: absolute;
               bottom:0;
               /* top: 3rem;
               left: 3rem;
               z-index: 4; */
              }
                #child-3{
                    width:2rem;
                    height:2rem;
                    background-color: rgb(244, 247, 55);
                    /* position: static; */
                    position:absolute;
                    bottom:0;
                    right:0;
                    /* top: 3rem;
                    left: 3rem;
                    z-index: 10; */
                }
                #fixed{
                    width:2rem;
                    height: 2rem;
                    border-radius: 1rem;
                    position: fixed;
                    bottom: 50px;
                    right:50px;
                    background-color: blueviolet;
                }
                #laurem{
                    height:1000px;
                }
                #sticky{
                    width:100%;
                    height:2rem;
                    position: sticky;
                    background-color: aqua;
                    top:0;
                }
        </style>
    </head>
    <body>
        <div id="sticky"></div>
        <header>
            <h1>The game of boxes</h1>
        </header>
        <div class="parent" id="parent">
            <div id="child-1"></div>
            <div id="child-2"></div>
            <div id="child-3"></div>
        </div>
        <div id="laurem">
            <p>laurem </p>

        </div>
        <div id="fixed"></div>
    </body>
</html>
